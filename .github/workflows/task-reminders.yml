name: WhatsApp task-due reminders

# Every 5 minutes, checks for tasks due within the next 10 minutes and WhatsApps whoever should
# see it (see /api/cron/task-reminders) — no-ops if nothing's due or no one's opted in.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  task-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/task-reminders
        run: |
          curl -sf -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://portal-built-by-jawad.vercel.app/api/cron/task-reminders?x-vercel-protection-bypass=${{ secrets.VERCEL_PROTECTION_BYPASS }}"
